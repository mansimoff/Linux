---
- name: Initial server setup
  hosts: all
  become: true

  vars:
    admin_user: ruslan
    ssh_port: 222
    admin_ssh_key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

  tasks:

    # -------------------------
    # System
    # -------------------------

    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - sudo
          - nftables
          - sshguard
        state: present


    # -------------------------
    # User
    # -------------------------

    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        shell: /bin/bash
        create_home: true
        groups: sudo
        append: true
        state: present

    - name: Allow admin user to use sudo without password
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"


    - name: Add SSH public key for admin user
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ admin_ssh_key }}"
        state: present

    # -------------------------
    # SSH
    # -------------------------

    - name: Configure SSH port
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?Port '
        line: "Port {{ ssh_port }}"
        validate: "/usr/sbin/sshd -t"
      notify: Restart ssh

    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin '
        line: "PermitRootLogin no"
        validate: "/usr/sbin/sshd -t"
      notify: Restart ssh


    # -------------------------
    # Firewall
    # -------------------------

    - name: Configure nftables
      ansible.builtin.copy:
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          #!/usr/sbin/nft -f

          flush ruleset

          table inet filter {

              chain input {
                  type filter hook input priority filter; policy drop;

                  # Loopback
                  iifname "lo" accept

                  # Established / related connections
                  ct state established,related accept

                  # Invalid packets
                  ct state invalid drop

                  # ICMP / ICMPv6
                  meta l4proto { icmp, icmpv6 } accept

                  # SSH
                  tcp dport {{ ssh_port }} accept
              }

              chain forward {
                  type filter hook forward priority filter; policy drop;
              }

              chain output {
                  type filter hook output priority filter; policy accept;
              }
          }

    - name: Enable nftables
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        state: started

    - name: Reload nftables
      ansible.builtin.command:
        cmd: nft -f /etc/nftables.conf
      changed_when: true


    # -------------------------
    # SSHGuard
    # -------------------------

    - name: Enable sshguard
      ansible.builtin.systemd:
        name: sshguard
        enabled: true
        state: started


  handlers:

    - name: Restart ssh
      ansible.builtin.systemd:
        name: ssh
        state: restarted
